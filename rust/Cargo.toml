[package]
name = "aristech-nlp-client"
description = "A Rust client library for the Aristech Natrual Language Processing API"
version = "3.0.1"
edition = "2021"
repository = "https://github.com/aristech-de/nlp-clients"
keywords = ["nlp", "real-time", "streaming", "client-library"]
homepage = "https://github.com/aristech-de/nlp-clients/blob/main/rust/README.md"
authors = ["Martin Mende"]
license = "MIT"
categories = ["api-bindings"]

[dependencies]
tonic = { version = "0.14.2", features = [
  "tls-ring",
  "tls-native-roots",
  "gzip",
] }
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread"] }
tokio-stream = "0.1.17"
tonic-prost = "0.14.2"
prost = "0.14.1"
prost-types = "0.14.1"

[dev-dependencies]
dotenv = "0.15.0"

[build-dependencies]
tonic-prost-build = "0.14.2"

[[example]]
name = "functions"
path = "examples/functions.rs"

[[example]]
name = "run_functions"
path = "examples/runFunctions.rs"

[[example]]
name = "projects"
path = "examples/projects.rs"

[[example]]
name = "intents"
path = "examples/intents.rs"

[[example]]
name = "score_limits"
path = "examples/scoreLimits.rs"

[[example]]
name = "content"
path = "examples/content.rs"

[[example]]
name = "list_embedding_models"
path = "examples/list_embedding_models.rs"

[[example]]
name = "sync_dbs"
path = "examples/sync_dbs.rs"

[[example]]
name = "get_keywords"
path = "examples/get_keywords.rs"

[[example]]
name = "add_project"
path = "examples/add_project.rs"

[[example]]
name = "update_project"
path = "examples/update_project.rs"

[[example]]
name = "remove_project"
path = "examples/remove_project.rs"

[[example]]
name = "add_documents"
path = "examples/add_documents.rs"

[[example]]
name = "get_documents"
path = "examples/get_documents.rs"

[[example]]
name = "process_documents"
